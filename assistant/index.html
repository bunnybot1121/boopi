<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Compy UI</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent !important;
            overflow: hidden; /* Hide scrollbars */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        
        #video-container {
            width: 95vmin;
            height: 95vmin;
            -webkit-app-region: drag; /* Restore native dragging */
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease;
        }

        /* Hover interaction */
        #video-container:hover {
            cursor: move;
            transform: scale(1.02);
        }

        /* ------------------------- */
        /* LIVE-2D CSS ANIMATION ECS */
        /* ------------------------- */
        @keyframes float-idle {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-6px) scale(1.01); }
            100% { transform: translateY(0px) scale(1); }
        }
        @keyframes pulse-listening {
            0% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.05) translateY(-2px); }
            100% { transform: scale(1) translateY(0); }
        }
        @keyframes rock-thinking {
            0% { transform: rotate(0deg) translateY(0); }
            25% { transform: rotate(4deg) translateY(-3px); }
            75% { transform: rotate(-4deg) translateY(3px); }
            100% { transform: rotate(0deg) translateY(0); }
        }
        @keyframes bounce-talking {
            0%, 100% { transform: translateY(0) scaleX(1); }
            40% { transform: translateY(-10px) scaleX(1.02); }
            60% { transform: translateY(-12px) scaleX(0.98); }
        }
        @keyframes shake-error {
            0%, 100% { transform: translateX(0) rotate(0deg); filter: grayscale(0%); }
            25% { transform: translateX(-6px) rotate(-3deg); filter: grayscale(50%); }
            75% { transform: translateX(6px) rotate(3deg); filter: grayscale(50%); }
        }

        .anim-idle { animation: float-idle 4s ease-in-out infinite; }
        .anim-listening { animation: pulse-listening 1.2s ease-in-out infinite; }
        .anim-thinking { animation: rock-thinking 2.5s ease-in-out infinite; }
        .anim-talking { animation: bounce-talking 0.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .anim-error { animation: shake-error 0.15s ease-in-out infinite; }

        /* Anime Thought Bubble CSS */
        #thought-bubble {
            position: absolute;
            bottom: 72vw;
            right: 6vw;
            background: #fff;
            border: 1.2vw solid #333;
            border-radius: 8vw; /* Changed from 50% to prevent weird oval stretching on long text */
            padding: 4vw 6vw;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            font-size: 5.2vw;
            line-height: 1.4;
            font-weight: bold;
            color: #333;
            min-width: 24vw;
            max-width: 72vw; /* Increased max width so it grows horizontally before vertically */
            word-wrap: break-word;
            text-align: center;
            box-shadow: 1.2vw 1.2vw 0px rgba(0,0,0,0.2);
            opacity: 0;
            transform: scale(0.8) translateY(2vw);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 200;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Anime Bubble Trail (Big dot) */
        #thought-bubble::before {
            content: '';
            position: absolute;
            bottom: -4.8vw;
            left: 8vw;
            width: 5.6vw;
            height: 5.6vw;
            background: #fff;
            border: 1.2vw solid #333;
            border-radius: 50%;
            box-shadow: 0.8vw 0.8vw 0px rgba(0,0,0,0.2);
        }

        /* Anime Bubble Trail (Small dot) */
        #thought-bubble::after {
            content: '';
            position: absolute;
            bottom: -9.6vw;
            left: 3.2vw;
            width: 3.2vw;
            height: 3.2vw;
            background: #fff;
            border: 1.2vw solid #333;
            border-radius: 50%;
            box-shadow: 0.8vw 0.8vw 0px rgba(0,0,0,0.2);
        }

        #thought-bubble.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        /* Glitter particles */
        .glitter {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #ffd700;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 10px #ffd700, 0 0 20px #fff;
            animation: glitter-float 2s ease-out forwards;
            z-index: 100;
        }

        @keyframes glitter-float {
            0% { transform: translateY(0) scale(0) rotate(0deg); opacity: 1; }
            50% { transform: translateY(-50px) scale(1) rotate(180deg); opacity: 0.8; }
            100% { transform: translateY(-100px) scale(0) rotate(360deg); opacity: 0; }
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "./node_modules/three/build/three.module.js",
                "three/addons/": "./node_modules/three/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="video-container">
    </div>
    
    <div id="thought-bubble"></div>

    <script src="./node_modules/@rive-app/canvas/rive.js"></script>
    <script>
        // Expose ipcRenderer globally so ES Modules can access it
        window.ipcRenderer = require('electron').ipcRenderer;
    </script>
    <script type="module">
        import { init3D, set3DState, setSpeechText, onSpeechDone, onErrorOccurred } from './mascot_handler.js';
        const ipcRenderer = window.ipcRenderer;

        // Initialize the Rive Mascot scene
        init3D('video-container');

        // Allow user to resize by scrolling mouse wheel over the character
        document.addEventListener('wheel', (e) => {
            if (!e.ctrlKey) return; // Prevent accidental resizing! User must hold Ctrl.
            const step = e.deltaY > 0 ? -25 : 25; // Scroll down = shrink, Scroll up = grow
            ipcRenderer.send('resize-window', step);
        });

        // Visual effect for positive emotional states
        function spawnGlitters() {
            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const glitter = document.createElement('div');
                    glitter.className = 'glitter';
                    const offsetX = (Math.random() - 0.5) * 150;
                    const offsetY = (Math.random() - 0.5) * 150;
                    glitter.style.left = `calc(50% + ${offsetX}px)`;
                    glitter.style.top = `calc(50% + ${offsetY}px)`;
                    
                    const colors = ['#ffd700', '#ffb6c1', '#add8e6', '#ffffff'];
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    glitter.style.backgroundColor = color;
                    glitter.style.boxShadow = `0 0 10px ${color}, 0 0 20px #fff`;
                    
                    document.body.appendChild(glitter);
                    setTimeout(() => glitter.remove(), 2000);
                }, i * 100);
            }
        }

        const thoughtBubble = document.getElementById('thought-bubble');
        let bubbleTimeout = null;
        let previousUIState = 'idle';
        
        const stateThoughts = {
            "idle": "Zzz...",
            "listening": "I'm listening...",
            "thinking": "Let me think...",
            "talking": "Blah blah...",
            "error": "Oops, error!",
            "angry": "Why are you not talking to me?! 😤",
            "happy": "Yay! ^_^",
            "startup": "Hello there! 👋",
            "praise": "Hehe! 😊",
            "excited": "So exciting! ✨",
            "booting": "Loading...",
            "chilling": "Just chilling~",
            "waiting": "Any orders?",
            "writing": "Writing some code... ✍️",
            "reading": "Reading files... 📖",
            "recording": "Capturing screen... 📸",
            "drinking_coffee": "Processing... 🧋",
            "confused": "Hmm, let me think... 🤔",
            "concerned": "Oh no, let me check... 😟",
            "cautious": "Be careful... ⚠️",
            "celebrating": "Woohoo! Let's celebrate! 🎉",
            "surprised": "Oh! Fascinating... 🔍",
            "sleeping": "Zzz... 💤"
        };

        ipcRenderer.on('state-changed', (event, state) => {
            console.log("Updating UI state to: ", state);
            
            // Route state change to Rive mascot handler (handles transitions internally)
            set3DState(state);
            
            // Clear CSS animation classes
            const container = document.getElementById('video-container');
            container.className = ''; 
            
            // Update thought bubble
            if (stateThoughts[state]) {
                thoughtBubble.innerText = stateThoughts[state];
                thoughtBubble.classList.add('visible');
                
                if (bubbleTimeout) clearTimeout(bubbleTimeout);
                bubbleTimeout = setTimeout(() => {
                    thoughtBubble.classList.remove('visible');
                }, 4000);
            } else {
                thoughtBubble.classList.remove('visible');
            }
            
            // Spawn glitters for positive emotional states
            if (['happy', 'excited', 'praise', 'celebrating'].includes(state)) {
                spawnGlitters();
            }

            previousUIState = state;
        });

         ipcRenderer.on('speech-text', (event, text) => {
            if (text && !text.startsWith("Heard: ")) {
                setSpeechText(text);
            }
            // Show only the current voice chunk (max 45 characters) to prevent stretching the thought cloud
            let displayText = text || "";
            if (displayText.length > 45) {
                displayText = displayText.substring(0, 42) + "...";
            }
            thoughtBubble.innerText = displayText;
            
            thoughtBubble.classList.add('visible');
            if (bubbleTimeout) clearTimeout(bubbleTimeout);
            bubbleTimeout = setTimeout(() => {
                thoughtBubble.classList.remove('visible');
            }, 3000);
        });

    </script>
</body>
</html>
