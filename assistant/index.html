<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Compy UI</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: transparent !important;
            overflow: hidden !important; /* Hide scrollbars */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        /* Hide scrollbars for Chrome, Safari and Opera (Electron) */
        ::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }

        /* Hide scrollbars for IE, Edge and Firefox */
        * {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }
        
        #interactive-trigger {
            position: absolute;
            width: 140px;
            height: 160px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.01);
            z-index: 9999;
            cursor: move;
            pointer-events: auto;
        }
        #interactive-trigger:hover ~ #video-container {
            transform: scale(1.02);
        }
        
        #video-container {
            width: 95vmin;
            height: 95vmin;
            -webkit-app-region: no-drag;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease;
            pointer-events: none;
        }

        #mascot-svg {
            width: 70%;
            height: 70%;
            overflow: visible;
        }

        /* Anime Thought Bubble CSS */
        #thought-bubble {
            position: absolute;
            bottom: 72vw;
            right: 6vw;
            background: #fff;
            border: 1.2vw solid #333;
            border-radius: 8vw; /* Changed from 50% to prevent weird oval stretching on long text */
            padding: 4vw 6vw;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            font-size: 5.2vw;
            line-height: 1.4;
            font-weight: bold;
            color: #333;
            min-width: 24vw;
            max-width: 72vw; /* Increased max width so it grows horizontally before vertically */
            word-wrap: break-word;
            text-align: center;
            box-shadow: 1.2vw 1.2vw 0px rgba(0,0,0,0.2);
            opacity: 0;
            transform: scale(0.8) translateY(2vw);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 200;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Anime Bubble Trail (Big dot) */
        #thought-bubble::before {
            content: '';
            position: absolute;
            bottom: -4.8vw;
            left: 8vw;
            width: 5.6vw;
            height: 5.6vw;
            background: #fff;
            border: 1.2vw solid #333;
            border-radius: 50%;
            box-shadow: 0.8vw 0.8vw 0px rgba(0,0,0,0.2);
        }

        /* Anime Bubble Trail (Small dot) */
        #thought-bubble::after {
            content: '';
            position: absolute;
            bottom: -9.6vw;
            left: 3.2vw;
            width: 3.2vw;
            height: 3.2vw;
            background: #fff;
            border: 1.2vw solid #333;
            border-radius: 50%;
            box-shadow: 0.8vw 0.8vw 0px rgba(0,0,0,0.2);
        }

        #thought-bubble.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        /* Glitter particles */
        .glitter {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #ffd700;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 10px #ffd700, 0 0 20px #fff;
            animation: glitter-float 2s ease-out forwards;
            z-index: 100;
        }

        @keyframes glitter-float {
            0% { transform: translateY(0) scale(0) rotate(0deg); opacity: 1; }
            50% { transform: translateY(-50px) scale(1) rotate(180deg); opacity: 0.8; }
            100% { transform: translateY(-100px) scale(0) rotate(360deg); opacity: 0; }
        }
    </style>

                <path d="M509.127 502.936C514.767 498.973 514.929 497.593 518.612 491.664L520.234 492.572C521.198 496.986 512.309 506.706 507.958 505.884L507.711 505.234L509.127 502.936Z" fill="#312E24" />

              <!-- Thinking mouth -->

              <!-- Talking mouth -->
              <g id="talking-mouth-group" style="display: none;">

            <!-- Zzz letters -->
            <g id="zzz-group" style="display: none;">
              <text id="z1" x="605" y="220" font-size="40" font-family="Arial Rounded MT Bold, Arial Black, Arial, sans-serif" font-weight="900" fill="#5B9BD5" opacity="0" text-anchor="middle">Z</text>
              <text id="z2" x="624" y="220" font-size="56" font-family="Arial Rounded MT Bold, Arial Black, Arial, sans-serif" font-weight="900" fill="#4A8AC4" opacity="0" text-anchor="middle">Z</text>
              <text id="z3" x="643" y="220" font-size="76" font-family="Arial Rounded MT Bold, Arial Black, Arial, sans-serif" font-weight="900" fill="#3A7AB3" opacity="0" text-anchor="middle">Z</text>

    <div id="thought-bubble"></div>

    <script>
        // Expose ipcRenderer globally so ES Modules can access it
        window.ipcRenderer = require('electron').ipcRenderer;
    </script>
    <script type="module">
        import { initSVG, setMascotState, setSpeechText, onSpeechDone, onErrorOccurred, setMascotMode } from './mascot_handler.js';
        const ipcRenderer = window.ipcRenderer;

        // Initialize the SVG Mascot scene
        initSVG('video-container');

        // Temporary diagnostics log
        setTimeout(() => {
            const faceGroup = document.getElementById('face-group');
            const awakeEyes = document.getElementById('awake-eyes-group');
            const normalMouth = document.getElementById('normal-mouth-group');
            const bodyPath = document.getElementById('body-path');
            
            console.log("=== DIAGNOSTICS ===");
            console.log("faceGroup exists:", !!faceGroup);
            if (faceGroup) {
                console.log("faceGroup display:", faceGroup.style.display);
                console.log("faceGroup opacity:", faceGroup.getAttribute('opacity'));
                console.log("faceGroup transform:", faceGroup.getAttribute('transform'));
                const rect = faceGroup.getBoundingClientRect();
                console.log("faceGroup bounds:", JSON.stringify(rect));
            }
            console.log("awakeEyes exists:", !!awakeEyes);
            if (awakeEyes) {
                console.log("awakeEyes display:", awakeEyes.style.display);
                console.log("awakeEyes bounds:", JSON.stringify(awakeEyes.getBoundingClientRect()));
            }
            console.log("normalMouth exists:", !!normalMouth);
            if (normalMouth) {
                console.log("normalMouth display:", normalMouth.style.display);
                console.log("normalMouth opacity:", normalMouth.getAttribute('opacity'));
                console.log("normalMouth bounds:", JSON.stringify(normalMouth.getBoundingClientRect()));
            }
            console.log("bodyPath exists:", !!bodyPath);
            if (bodyPath) {
                console.log("bodyPath bounds:", JSON.stringify(bodyPath.getBoundingClientRect()));
            }
            console.log("===================");
        }, 5000);

        // Allow user to resize by scrolling mouse wheel over the character
        document.addEventListener('wheel', (e) => {
            if (!e.ctrlKey) return; // Prevent accidental resizing! User must hold Ctrl.
            const step = e.deltaY > 0 ? -25 : 25; // Scroll down = shrink, Scroll up = grow
            ipcRenderer.send('resize-window', step);
        });

        // Visual effect for positive emotional states
        function spawnGlitters() {
            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const glitter = document.createElement('div');
                    glitter.className = 'glitter';
                    const offsetX = (Math.random() - 0.5) * 150;
                    const offsetY = (Math.random() - 0.5) * 150;
                    glitter.style.left = `calc(50% + ${offsetX}px)`;
                    glitter.style.top = `calc(50% + ${offsetY}px)`;
                    
                    const colors = ['#ffd700', '#ffb6c1', '#add8e6', '#ffffff'];
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    glitter.style.backgroundColor = color;
                    glitter.style.boxShadow = `0 0 10px ${color}, 0 0 20px #fff`;
                    
                    document.body.appendChild(glitter);
                    setTimeout(() => glitter.remove(), 2000);
                }, i * 100);
            }
        }

        const thoughtBubble = document.getElementById('thought-bubble');
        let bubbleTimeout = null;
        let previousUIState = 'idle';
        
        const stateThoughts = {
            "idle": "Zzz...",
            "listening": "I'm listening...",
            "thinking": "Let me think...",
            "talking": "Blah blah...",
            "error": "Oops, error!",
            "angry": "Why are you not talking to me?! 😤",
            "happy": "Yay! ^_^",
            "startup": "Hello there! 👋",
            "praise": "Hehe! 😊",
            "excited": "So exciting! ✨",
            "booting": "Loading...",
            "chilling": "Just chilling~",
            "waiting": "Any orders?",
            "writing": "Writing some code... ✍️",
            "reading": "Reading files... 📖",
            "recording": "Capturing screen... 📸",
            "drinking_coffee": "Processing... 🧋",
            "confused": "Hmm, let me think... 🤔",
            "concerned": "Oh no, let me check... 😟",
            "cautious": "Be careful... ⚠️",
            "celebrating": "Woohoo! Let's celebrate! 🎉",
            "surprised": "Oh! Fascinating... 🔍",
            "sleeping": "Zzz... 💤"
        };

        ipcRenderer.on('state-changed', (event, state) => {
            console.log("Updating UI state to: ", state);
            
            // Route state change to mascot handler (handles transitions internally)
            setMascotState(state);
            
            // Update thought bubble
            if (stateThoughts[state]) {
                thoughtBubble.innerText = stateThoughts[state];
                thoughtBubble.classList.add('visible');
                
                if (bubbleTimeout) clearTimeout(bubbleTimeout);
                bubbleTimeout = setTimeout(() => {
                    thoughtBubble.classList.remove('visible');
                }, 4000);
            } else {
                thoughtBubble.classList.remove('visible');
            }
            
            // Spawn glitters for positive emotional states
            if (['happy', 'excited', 'praise', 'celebrating'].includes(state)) {
                spawnGlitters();
            }

            previousUIState = state;
        });

         ipcRenderer.on('speech-text', (event, text) => {
            if (text && !text.startsWith("Heard: ")) {
                setSpeechText(text);
            }
            // Show only the current voice chunk (max 45 characters) to prevent stretching the thought cloud
            let displayText = text || "";
            if (displayText.length > 45) {
                displayText = displayText.substring(0, 42) + "...";
            }
            thoughtBubble.innerText = displayText;
            
            thoughtBubble.classList.add('visible');
            if (bubbleTimeout) clearTimeout(bubbleTimeout);
            bubbleTimeout = setTimeout(() => {
                thoughtBubble.classList.remove('visible');
            }, 3000);
        });

         ipcRenderer.on('mode-changed', (event, mode) => {
            console.log("Updating UI mode to: ", mode);
            setMascotMode(mode);
            const modeNum = parseInt(mode, 10);
            if (thoughtBubble) {
                thoughtBubble.innerText = (modeNum === 2) ? "Mode 2: Robotic Mode 🤖" : "Mode 1: Conversational 💬";
                thoughtBubble.classList.add('visible');
                if (bubbleTimeout) clearTimeout(bubbleTimeout);
                bubbleTimeout = setTimeout(() => {
                    thoughtBubble.classList.remove('visible');
                }, 2500);
            }
         });

         // Custom IPC-based window dragging
         let isDragging = false;
         let startX = 0;
         let startY = 0;

         const trigger = document.getElementById('interactive-trigger');

         trigger.addEventListener('mousedown', (e) => {
             if (e.button !== 0) return; // Only left click dragging
             isDragging = true;
             startX = e.screenX;
             startY = e.screenY;
             ipcRenderer.send('window-drag-start');
         });

         window.addEventListener('mousemove', (e) => {
             if (!isDragging) return;
             const deltaX = e.screenX - startX;
             const deltaY = e.screenY - startY;
             startX = e.screenX;
             startY = e.screenY;
             ipcRenderer.send('window-drag', { deltaX, deltaY });
         });

         const stopDrag = () => {
             if (isDragging) {
                 isDragging = false;
                 ipcRenderer.send('window-drag-end');
             }
         };

         window.addEventListener('mouseup', stopDrag);
         window.addEventListener('blur', stopDrag);

      </script>
</body>
</html>
