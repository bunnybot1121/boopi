<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Compy UI</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent !important;
            overflow: hidden; /* Hide scrollbars */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        
        #video-container {
            width: 95vmin;
            height: 95vmin;
            border-radius: 50%;
            overflow: hidden;
            -webkit-app-region: drag; /* Let users click and drag the character */
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        #state-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none; /* Make character unclickable for drag to work behind it */
        }

        /* Hover interaction */
        #video-container:hover {
            cursor: move;
            transform: scale(1.02);
        }

        /* ------------------------- */
        /* LIVE-2D CSS ANIMATION ECS */
        /* ------------------------- */
        @keyframes float-idle {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-6px) scale(1.01); }
            100% { transform: translateY(0px) scale(1); }
        }
        @keyframes pulse-listening {
            0% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.08) translateY(-2px); }
            100% { transform: scale(1) translateY(0); }
        }
        @keyframes rock-thinking {
            0% { transform: rotate(0deg) translateY(0); }
            25% { transform: rotate(4deg) translateY(-3px); }
            75% { transform: rotate(-4deg) translateY(3px); }
            100% { transform: rotate(0deg) translateY(0); }
        }
        @keyframes bounce-talking {
            0%, 100% { transform: translateY(0) scaleX(1); }
            40% { transform: translateY(-10px) scaleX(1.02); }
            60% { transform: translateY(-12px) scaleX(0.98); }
        }
        @keyframes shake-error {
            0%, 100% { transform: translateX(0) rotate(0deg); filter: grayscale(0%); }
            25% { transform: translateX(-6px) rotate(-3deg); filter: grayscale(50%); }
            75% { transform: translateX(6px) rotate(3deg); filter: grayscale(50%); }
        }

        .anim-idle { animation: float-idle 4s ease-in-out infinite; }
        .anim-listening { animation: pulse-listening 1.2s ease-in-out infinite; }
        .anim-thinking { animation: rock-thinking 2.5s ease-in-out infinite; }
        .anim-talking { animation: bounce-talking 0.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .anim-error { animation: shake-error 0.15s ease-in-out infinite; }

        /* Glitter particles */
        .glitter {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #ffd700;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 10px #ffd700, 0 0 20px #fff;
            animation: glitter-float 2s ease-out forwards;
            z-index: 100;
        }

        @keyframes glitter-float {
            0% { transform: translateY(0) scale(0) rotate(0deg); opacity: 1; }
            50% { transform: translateY(-50px) scale(1) rotate(180deg); opacity: 0.8; }
            100% { transform: translateY(-100px) scale(0) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="video-container">
        <!-- Live-2D Native GIF Element -->
        <img id="state-image" src="assets/animations/idle.gif" />
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        const imageElement = document.getElementById('state-image');

        // Allow user to resize by scrolling mouse wheel over the character
        document.addEventListener('wheel', (e) => {
            const step = e.deltaY > 0 ? -25 : 25; // Scroll down = shrink, Scroll up = grow
            ipcRenderer.send('resize-window', step);
        });

        // Mapping states to user-supplied transparent GIFs
        const stateImages = {
            "idle": "assets/animations/Consola Zzz GIF - Consola Zzz Dormida - Discover & Share GIFs/lazy_sleepy.gif",
            "listening": "assets/animations/Himouto Umaru Chan GIF - Himouto Umaru Chan Anime - Discover & Share GIFs/waiting for the command.gif",
            "thinking": "assets/animations/Himouto Umaru Chan GIF - Himouto Umaru Chan Rodar - Discover & Share GIFs/loading.gif",
            "talking": "assets/animations/100 GIF - 100 - Discover & Share GIFs/typing.gif",
            "error": "assets/animations/Umaru Chan GIF - Umaru chan - Discover & Share GIFs/angry.gif",
            "angry": "assets/animations/Umaru Chan GIF - Umaru chan - Discover & Share GIFs/angry.gif",
            "happy": "assets/animations/Anime Umaru Chan GIF - Anime Umaru Chan Cute - Discover & Share GIFs/feels_happy.gif",
            "startup": "assets/animations/Himouto Umaru Chan GIF - Himouto Umaru Chan Anime - Discover & Share GIFs/when i start her.gif",
            "praise": "assets/animations/Himouto Umaruchan Umaru GIF - Himouto Umaruchan Umaru Pat - Discover & Share GIFs/when i praise her.gif",
            "excited": "assets/animations/Himouto Umaru Chan Anime GIF - Himouto Umaru Chan Anime Umaru Doma - Discover & Share GIFs/excited.gif",
            "booting": "assets/animations/Umaru Chan Anime GIF - Umaru Chan Anime Cute - Discover & Share GIFs/booting.gif",
            "chilling": "assets/animations/Phone Chilling GIF - Phone Chilling Kawaii - Discover & Share GIFs/chilling.gif",
            "waiting": "assets/animations/Ok Ent GIF - Ok Ent - Discover & Share GIFs/waiting.gif"
        };
        
        // Mapping states to Live-2D CSS keyframes
        const stateAnimations = {
            "idle": "anim-idle",
            "listening": "anim-listening",
            "thinking": "anim-thinking",
            "talking": "anim-talking",
            "error": "anim-error"
        };


        // Visual effect for happy states
        function spawnGlitters() {
            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const glitter = document.createElement('div');
                    glitter.className = 'glitter';
                    // Randomize position near the center
                    const offsetX = (Math.random() - 0.5) * 150;
                    const offsetY = (Math.random() - 0.5) * 150;
                    glitter.style.left = `calc(50% + ${offsetX}px)`;
                    glitter.style.top = `calc(50% + ${offsetY}px)`;
                    
                    // Add random colors for sparkles
                    const colors = ['#ffd700', '#ffb6c1', '#add8e6', '#ffffff'];
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    glitter.style.backgroundColor = color;
                    glitter.style.boxShadow = `0 0 10px ${color}, 0 0 20px #fff`;
                    
                    document.body.appendChild(glitter);
                    
                    // Remove after animation completes
                    setTimeout(() => glitter.remove(), 2000);
                }, i * 100); // Stagger the spawn
            }
        }

        ipcRenderer.on('state-changed', (event, state) => {
            console.log("Updating UI state to: ", state);
            if (stateImages[state]) {
                imageElement.src = stateImages[state];
                
                if (['happy', 'excited', 'praise'].includes(state)) {
                    spawnGlitters();
                }
            }
        });
    </script>
</body>
</html>
