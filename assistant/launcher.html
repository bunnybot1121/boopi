<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bupi Launcher</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0d0f1a;
    --surface: #151826;
    --border: rgba(99, 102, 241, 0.25);
    --primary: #6366f1;
    --primary-glow: rgba(99, 102, 241, 0.4);
    --green: #22c55e;
    --red: #ef4444;
    --text: #e2e8f0;
    --muted: #64748b;
    --radius: 16px;
  }

  body {
    background: transparent;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    width: 280px;
    height: 340px;
    -webkit-app-region: no-drag;
  }

  .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(99, 102, 241, 0.1),
      0 20px 60px rgba(0, 0, 0, 0.8),
      0 0 40px rgba(99, 102, 241, 0.08);
    animation: fadeIn 0.18s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #1e2040, #141628);
    padding: 18px 16px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  .header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--primary), transparent);
    opacity: 0.6;
  }

  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid var(--primary);
    object-fit: cover;
    box-shadow: 0 0 12px var(--primary-glow);
    flex-shrink: 0;
  }

  .header-info { flex: 1; min-width: 0; }
  .header-info h1 { font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: 0.3px; }
  .header-info p  { font-size: 11px; color: var(--muted); margin-top: 1px; }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    box-shadow: none;
    transition: background 0.4s, box-shadow 0.4s;
    flex-shrink: 0;
  }
  .status-dot.running {
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 2s infinite;
  }
  .status-dot.stopping {
    background: var(--red);
    box-shadow: 0 0 8px var(--red);
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* Status label */
  .status-label {
    font-size: 11px;
    padding: 6px 12px;
    text-align: center;
    color: var(--muted);
    background: rgba(255,255,255,0.02);
    border-bottom: 1px solid rgba(255,255,255,0.04);
    letter-spacing: 0.4px;
    transition: color 0.3s;
  }
  .status-label.running { color: var(--green); }
  .status-label.stopping { color: var(--red); }

  /* Buttons */
  .actions { padding: 10px 12px 8px; display: flex; flex-direction: column; gap: 6px; flex: 1; }

  .btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid transparent;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    background: rgba(255,255,255,0.04);
    transition: background 0.15s, border-color 0.15s, transform 0.1s, box-shadow 0.15s;
    -webkit-user-select: none;
    user-select: none;
    text-align: left;
    width: 100%;
  }

  .btn:hover {
    background: rgba(99, 102, 241, 0.12);
    border-color: rgba(99, 102, 241, 0.3);
    box-shadow: 0 0 12px rgba(99, 102, 241, 0.1);
  }

  .btn:active { transform: scale(0.97); }

  .btn.primary {
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    border-color: rgba(99, 102, 241, 0.5);
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.25);
  }

  .btn.primary:hover {
    background: linear-gradient(135deg, #5b52f0, #8b44f8);
    box-shadow: 0 4px 20px rgba(99, 102, 241, 0.45);
  }

  .btn.danger:hover {
    background: rgba(239, 68, 68, 0.12);
    border-color: rgba(239, 68, 68, 0.3);
    box-shadow: 0 0 12px rgba(239, 68, 68, 0.1);
  }

  .btn.disabled, .btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    pointer-events: none;
  }

  .btn-icon { font-size: 16px; width: 20px; text-align: center; }
  .btn-text { flex: 1; }

  /* Divider */
  .divider { height: 1px; background: rgba(255,255,255,0.06); margin: 2px 12px; }

  /* Footer */
  .footer {
    padding: 8px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(255,255,255,0.05);
  }
  .footer-text { font-size: 10px; color: var(--muted); }

  /* Startup toggle */
  .toggle-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    cursor: pointer;
    border-radius: 10px;
    border: 1px solid transparent;
    transition: background 0.15s, border-color 0.15s;
  }
  .toggle-row:hover {
    background: rgba(255,255,255,0.04);
    border-color: rgba(255,255,255,0.08);
  }

  .toggle-label { font-size: 12px; color: var(--muted); flex: 1; }

  .toggle-switch {
    width: 32px; height: 18px;
    background: var(--muted);
    border-radius: 9px;
    position: relative;
    transition: background 0.25s;
    flex-shrink: 0;
  }
  .toggle-switch.on { background: var(--primary); }
  .toggle-switch::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 14px; height: 14px;
    background: white;
    border-radius: 50%;
    transition: transform 0.25s;
  }
  .toggle-switch.on::after { transform: translateX(14px); }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <img class="avatar" id="avatarImg" src="./assets/icon.png" alt="Bupi" onerror="this.style.display='none'" />
    <div class="header-info">
      <h1>Bupi Companion</h1>
      <p>Desktop AI Assistant</p>
    </div>
    <div class="status-dot" id="statusDot"></div>
  </div>

  <div class="status-label" id="statusLabel">Not running</div>

  <div class="actions">
    <button class="btn primary" id="btnLaunch" onclick="launchBupi()">
      <span class="btn-icon">🚀</span>
      <span class="btn-text">Launch Bupi</span>
    </button>

    <button class="btn danger disabled" id="btnStop" onclick="stopBupi()">
      <span class="btn-icon">⏹️</span>
      <span class="btn-text">Stop Bupi</span>
    </button>

    <div class="divider"></div>

    <button class="btn" onclick="openSettings()">
      <span class="btn-icon">⚙️</span>
      <span class="btn-text">Open Settings</span>
    </button>

    <button class="btn" onclick="openLogs()">
      <span class="btn-icon">📋</span>
      <span class="btn-text">View Logs</span>
    </button>

    <div class="divider"></div>

    <div class="toggle-row" onclick="toggleStartup()">
      <span class="btn-icon" style="font-size:14px">⚡</span>
      <span class="toggle-label">Launch at Windows startup</span>
      <div class="toggle-switch" id="startupToggle"></div>
    </div>
  </div>

  <div class="footer">
    <span class="footer-text" id="versionLabel">Bupi v1.0</span>
    <button class="btn danger" style="padding:5px 10px;font-size:11px;width:auto;border-radius:6px" onclick="quitLauncher()">
      Quit Launcher
    </button>
  </div>
</div>

<script>
  const { ipcRenderer } = require('electron');

  let isRunning = false;
  let isStartupEnabled = false;

  // — IPC from main process —
  ipcRenderer.on('bupi-status', (event, status) => {
    setStatus(status);
  });

  ipcRenderer.on('startup-status', (event, enabled) => {
    isStartupEnabled = enabled;
    document.getElementById('startupToggle').classList.toggle('on', enabled);
  });

  function setStatus(status) {
    const dot   = document.getElementById('statusDot');
    const label = document.getElementById('statusLabel');
    const btnLaunch = document.getElementById('btnLaunch');
    const btnStop   = document.getElementById('btnStop');

    if (status === 'running') {
      isRunning = true;
      dot.className = 'status-dot running';
      label.textContent = '● Bupi is running';
      label.className = 'status-label running';
      btnLaunch.classList.add('disabled');
      btnStop.classList.remove('disabled');
    } else if (status === 'stopped') {
      isRunning = false;
      dot.className = 'status-dot';
      label.textContent = 'Not running';
      label.className = 'status-label';
      btnLaunch.classList.remove('disabled');
      btnStop.classList.add('disabled');
    } else if (status === 'starting') {
      dot.className = 'status-dot running';
      label.textContent = '◌ Starting Bupi...';
      label.className = 'status-label running';
      btnLaunch.classList.add('disabled');
      btnStop.classList.add('disabled');
    } else if (status === 'stopping') {
      dot.className = 'status-dot stopping';
      label.textContent = '◌ Stopping Bupi...';
      label.className = 'status-label stopping';
      btnLaunch.classList.add('disabled');
      btnStop.classList.add('disabled');
    }
  }

  function launchBupi() {
    if (isRunning) return;
    setStatus('starting');
    ipcRenderer.send('launch-bupi');
  }

  function stopBupi() {
    if (!isRunning) return;
    setStatus('stopping');
    ipcRenderer.send('stop-bupi');
  }

  function openSettings() {
    ipcRenderer.send('open-settings');
  }

  function openLogs() {
    ipcRenderer.send('open-logs');
  }

  function toggleStartup() {
    isStartupEnabled = !isStartupEnabled;
    document.getElementById('startupToggle').classList.toggle('on', isStartupEnabled);
    ipcRenderer.send('toggle-startup', isStartupEnabled);
  }

  function quitLauncher() {
    ipcRenderer.send('quit-launcher');
  }

  // Ask main process for current status on load
  ipcRenderer.send('get-status');
</script>
</body>
</html>
