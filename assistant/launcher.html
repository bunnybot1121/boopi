<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bupi Launcher</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #f5f4ef;
    --surface: #ffffff;
    --border: #111111;
    --primary: #111111;
    --primary-glow: transparent;
    --green: #111111;
    --red: #444444;
    --text: #111111;
    --muted: #555555;
    --radius: 4px;
    --shadow: 3px 3px 0px #111111;
  }

  body {
    background: transparent;
    font-family: 'Inter', -apple-system, sans-serif;
    overflow: hidden;
    width: 280px;
    height: 340px;
    -webkit-app-region: no-drag;
  }

  .card {
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: var(--shadow);
    animation: fadeIn 0.15s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Header */
  .header {
    background: #ebe8df;
    padding: 14px 14px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 2px solid var(--border);
    position: relative;
  }

  .header::after {
    display: none;
  }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 4px;
    border: 2px solid var(--border);
    object-fit: cover;
    box-shadow: 1px 1px 0px #111111;
    flex-shrink: 0;
  }

  .header-info { flex: 1; min-width: 0; }
  .header-info h1 { font-size: 14px; font-weight: 700; color: var(--text); letter-spacing: 0.3px; text-transform: uppercase; font-family: 'JetBrains Mono', monospace; }
  .header-info p  { font-size: 10.5px; color: var(--muted); margin-top: 1px; font-family: 'JetBrains Mono', monospace; }

  .status-dot {
    width: 10px; height: 10px;
    border-radius: 2px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .status-dot.running {
    background: var(--text);
  }
  .status-dot.stopping {
    background: #888888;
  }

  /* Status label */
  .status-label {
    font-size: 11px;
    padding: 6px 12px;
    text-align: center;
    color: var(--text);
    background: var(--surface);
    border-bottom: 1px dashed var(--border);
    letter-spacing: 0.5px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
  }
  .status-label.running { font-weight: 700; }
  .status-label.stopping { font-style: italic; }

  /* Buttons */
  .actions { padding: 10px 12px 8px; display: flex; flex-direction: column; gap: 6px; flex: 1; }

  .btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 3px;
    border: 1.5px solid var(--border);
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    background: var(--surface);
    box-shadow: 2px 2px 0px var(--border);
    transition: none;
    -webkit-user-select: none;
    user-select: none;
    text-align: left;
    width: 100%;
    font-family: 'JetBrains Mono', monospace;
  }

  .btn:hover {
    background: var(--text);
    color: var(--bg);
    transform: translate(1px, 1px);
    box-shadow: 1px 1px 0px var(--border);
  }

  .btn:active {
    transform: translate(2px, 2px);
    box-shadow: none;
  }

  .btn.primary {
    background: #111111;
    color: #f5f4ef;
  }

  .btn.primary:hover {
    background: #000000;
    color: #ffffff;
    box-shadow: 1px 1px 0px var(--border);
  }

  .btn.danger:hover {
    background: #000000;
    color: #ffffff;
  }

  .btn.disabled, .btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    pointer-events: none;
  }

  .btn-icon { font-size: 14px; width: 18px; text-align: center; }
  .btn-text { flex: 1; }

  /* Divider */
  .divider { height: 1px; border-top: 1px dashed #cccccc; margin: 2px 12px; }

  /* Footer */
  .footer {
    padding: 8px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1.5px solid var(--border);
    background: #ebe8df;
  }
  .footer-text { font-size: 10px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }

  /* Startup toggle */
  .toggle-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    cursor: pointer;
    border-radius: 3px;
    border: 1px solid transparent;
  }
  .toggle-row:hover {
    background: var(--surface);
    border-color: var(--border);
  }

  .toggle-label { font-size: 11px; color: var(--text); flex: 1; font-family: 'JetBrains Mono', monospace; font-weight: 600; }

  .toggle-switch {
    width: 30px; height: 16px;
    background: #ffffff;
    border: 1.5px solid var(--border);
    border-radius: 2px;
    position: relative;
    flex-shrink: 0;
  }
  .toggle-switch.on { background: #111111; }
  .toggle-switch::after {
    content: '';
    position: absolute;
    top: 1px; left: 1px;
    width: 10px; height: 10px;
    background: #111111;
    border-radius: 1px;
    transition: transform 0.15s;
  }
  .toggle-switch.on::after {
    background: #ffffff;
    transform: translateX(14px);
  }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <img class="avatar" id="avatarImg" src="./assets/icon.png" alt="Bupi" onerror="this.style.display='none'" />
    <div class="header-info">
      <h1>Bupi Companion</h1>
      <p>Desktop AI Assistant</p>
    </div>
    <div class="status-dot" id="statusDot"></div>
  </div>

  <div class="status-label" id="statusLabel">Not running</div>

  <div class="actions">
    <button class="btn primary" id="btnLaunch" onclick="launchBupi()">
      <span class="btn-icon">🚀</span>
      <span class="btn-text">Launch Bupi</span>
    </button>

    <button class="btn danger disabled" id="btnStop" onclick="stopBupi()">
      <span class="btn-icon">⏹️</span>
      <span class="btn-text">Stop Bupi</span>
    </button>

    <div class="divider"></div>

    <button class="btn" onclick="openSettings()">
      <span class="btn-icon">⚙️</span>
      <span class="btn-text">Open Settings</span>
    </button>

    <button class="btn" onclick="openLogs()">
      <span class="btn-icon">📋</span>
      <span class="btn-text">View Logs</span>
    </button>

    <div class="divider"></div>

    <div class="toggle-row" onclick="toggleStartup()">
      <span class="btn-icon" style="font-size:14px">⚡</span>
      <span class="toggle-label">Launch at Windows startup</span>
      <div class="toggle-switch" id="startupToggle"></div>
    </div>
  </div>

  <div class="footer">
    <span class="footer-text" id="versionLabel">Bupi v1.0</span>
    <button class="btn danger" style="padding:5px 10px;font-size:11px;width:auto;border-radius:6px" onclick="quitLauncher()">
      Quit Launcher
    </button>
  </div>
</div>

<script>
  const { ipcRenderer } = require('electron');

  let isRunning = false;
  let isStartupEnabled = false;

  // — IPC from main process —
  ipcRenderer.on('bupi-status', (event, status) => {
    setStatus(status);
  });

  ipcRenderer.on('startup-status', (event, enabled) => {
    isStartupEnabled = enabled;
    document.getElementById('startupToggle').classList.toggle('on', enabled);
  });

  function setStatus(status) {
    const dot   = document.getElementById('statusDot');
    const label = document.getElementById('statusLabel');
    const btnLaunch = document.getElementById('btnLaunch');
    const btnStop   = document.getElementById('btnStop');

    if (status === 'running') {
      isRunning = true;
      dot.className = 'status-dot running';
      label.textContent = '● Bupi is running';
      label.className = 'status-label running';
      btnLaunch.classList.add('disabled');
      btnStop.classList.remove('disabled');
    } else if (status === 'stopped') {
      isRunning = false;
      dot.className = 'status-dot';
      label.textContent = 'Not running';
      label.className = 'status-label';
      btnLaunch.classList.remove('disabled');
      btnStop.classList.add('disabled');
    } else if (status === 'starting') {
      dot.className = 'status-dot running';
      label.textContent = '◌ Starting Bupi...';
      label.className = 'status-label running';
      btnLaunch.classList.add('disabled');
      btnStop.classList.add('disabled');
    } else if (status === 'stopping') {
      dot.className = 'status-dot stopping';
      label.textContent = '◌ Stopping Bupi...';
      label.className = 'status-label stopping';
      btnLaunch.classList.add('disabled');
      btnStop.classList.add('disabled');
    }
  }

  function launchBupi() {
    if (isRunning) return;
    setStatus('starting');
    ipcRenderer.send('launch-bupi');
  }

  function stopBupi() {
    if (!isRunning) return;
    setStatus('stopping');
    ipcRenderer.send('stop-bupi');
  }

  function openSettings() {
    ipcRenderer.send('open-settings');
  }

  function openLogs() {
    ipcRenderer.send('open-logs');
  }

  function toggleStartup() {
    isStartupEnabled = !isStartupEnabled;
    document.getElementById('startupToggle').classList.toggle('on', isStartupEnabled);
    ipcRenderer.send('toggle-startup', isStartupEnabled);
  }

  function quitLauncher() {
    ipcRenderer.send('quit-launcher');
  }

  // Ask main process for current status on load
  ipcRenderer.send('get-status');
</script>
</body>
</html>
